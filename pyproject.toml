[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prisk"
version = "1.0.0"
description = "Multi-Asset Portfolio Risk and Stress-Testing Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pooja Master" }]
keywords = ["portfolio", "risk", "value-at-risk", "stress-testing", "finance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
